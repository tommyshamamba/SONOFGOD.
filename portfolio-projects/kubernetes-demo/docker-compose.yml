services:
  backend:
    build: ./backend
    networks:
      default:
        aliases: [backend-service]
    ports:
      - "127.0.0.1:3201:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
      APP_NAME: k8s-demo
      LOG_LEVEL: info
      FEATURE_FLAGS: '{"newFeature":true,"betaFeature":false}'
      API_KEY: demo-api-key
      DB_PASSWORD: demo-password
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      backend:
        condition: service_healthy
