apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-api-redis
  labels:
    app: blockchain-api
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain-api
      component: redis
  template:
    metadata:
      labels:
        app: blockchain-api
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
