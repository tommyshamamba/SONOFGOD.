apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-api-frontend
  labels:
    app: blockchain-api
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blockchain-api
      component: frontend
  template:
    metadata:
      labels:
        app: blockchain-api
        component: frontend
    spec:
      containers:
      - name: frontend
        image: blockchain-api-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: http://blockchain-api-backend:3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
