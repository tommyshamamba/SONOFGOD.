services:
  backend:
    build: ./backend
    networks:
      default:
        aliases: [blockchain-api-backend]
    ports:
      - "127.0.0.1:3301:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DEMO_MODE=true
      - DATA_FILE=/data/store.json
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - blockchain-data:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  blockchain-data:
